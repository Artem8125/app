<!DOCTYPE html>
<html>
<head>
  <title>Длина текста</title>
</head>
<body>

  <input type="text" id="textInput" placeholder="Введите текст">
  <p>Длина текста: <span id="textLength">0</span></p>

  <script>
    const input = document.getElementById('textInput');
    const lengthSpan = document.getElementById('textLength');

    input.addEventListener('input', () => {
      lengthSpan.textContent = input.value.length;
    });
  </script>

</body>
</html>
