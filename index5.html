<!DOCTYPE html>
<html>
<head>
    <title>Анимация при наведении</title>
    <style>
        .animated-box {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            transition: background-color 0.3s ease,
                        transform 0.3s ease; 
        }

        .animated-box:hover {
            background-color: lightgreen;
            transform: scale(1.2); 
        }
    </style>
</head>
<body>

    <div class="animated-box">Наведи сюда</div>

    <script>
    </script>

</body>
</html>
